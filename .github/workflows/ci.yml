name: CI

on:
  push:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax check
        run: python3 -m compileall -q src tests scripts
      - name: Unit and mocked integration tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
      - name: Scan tracked files for secrets
        run: python3 scripts/check_repo_secrets.py
